name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 语法检查
        run: python -m py_compile "头歌答题脚本/答题.py" "头歌答题脚本/cdp.py"

      - name: 单元测试
        run: python "头歌答题脚本/tests/test_archive.py"
