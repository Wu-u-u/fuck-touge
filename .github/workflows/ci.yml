name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 语法检查
        run: python -m compileall -q "头歌答题脚本"

      - name: 单元测试
        run: |
          for f in 头歌答题脚本/tests/test_*.py; do
            python "$f"
          done
