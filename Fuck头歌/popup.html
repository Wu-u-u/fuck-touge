<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    width: 280px;
    font: 13px/1.6 system-ui, "Noto Sans CJK SC", sans-serif;
    background: #11111b;
    color: #cdd6f4;
  }
  .box { padding: 14px 16px; }
  h1 { font-size: 14px; margin: 0 0 10px; font-weight: 600; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 0; }
  .lab { font-weight: 500; }
  .sub { font-size: 11px; color: #7f849c; }
  .desc { margin-top: 8px; font-size: 12px; color: #7f849c; }
  .desc.warn { color: #f9e2af; }
  .switch { position: relative; width: 44px; height: 24px; flex: none; }
  .switch input { display: none; }
  .slider {
    position: absolute; inset: 0; background: #45475a; border-radius: 12px;
    transition: .2s; cursor: pointer;
  }
  .slider::before {
    content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px;
    background: #fff; border-radius: 50%; transition: .2s;
  }
  input:checked + .slider { background: #cba6f7; }
  input:checked + .slider::before { transform: translateX(20px); }
  .pick { display: flex; gap: 6px; margin: 0 0 6px; }
  .pick[hidden] { display: none; }
  .opt {
    flex: 1; padding: 6px 4px; border-radius: 8px; border: 1px solid #313244;
    background: #1e1e2e; color: #cdd6f4; font: inherit; font-size: 12px; cursor: pointer;
  }
  .opt:hover { border-color: #585b70; }
  .opt.on { background: #cba6f7; border-color: #cba6f7; color: #11111b; font-weight: 600; }
</style>
</head>
<body>
  <div class="box">
    <h1>Fuck 头歌</h1>
    <div class="row">
      <div><div class="lab">主题</div><div class="sub" id="themeSub">深浅自动</div></div>
      <label class="switch"><input type="checkbox" id="tt"><span class="slider"></span></label>
    </div>
    <div class="pick" id="themePick" hidden>
      <button class="opt" data-name="catppuccin">Catppuccin</button>
      <button class="opt" data-name="github">GitHub 高对比</button>
    </div>
    <div class="row">
      <div><div class="lab">字体</div><div class="sub">Maple Mono · 仅英文（中文需自装）</div></div>
      <label class="switch"><input type="checkbox" id="tf"><span class="slider"></span></label>
    </div>
    <div class="row">
      <div><div class="lab">光标动画</div><div class="sub">平滑移动 · 打字时也会滑动</div></div>
      <label class="switch"><input type="checkbox" id="tc"><span class="slider"></span></label>
    </div>
    <div class="desc" id="msg">读取中…</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
