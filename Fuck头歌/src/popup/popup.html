<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    width: 320px;
    font: 13px/1.6 system-ui, "Noto Sans CJK SC", sans-serif;
    background: #11111b;
    color: #cdd6f4;
  }
  .box { padding: 14px 16px; }
  h1 { font-size: 14px; margin: 0 0 10px; font-weight: 600; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 0; }
  .lab { font-weight: 500; cursor: pointer; }
  .sub { font-size: 11px; color: #7f849c; }
  .desc { margin-top: 8px; font-size: 12px; color: #7f849c; }
  .desc.warn { color: #f9e2af; }
  .switch { position: relative; width: 44px; height: 24px; flex: none; }
  /* 视觉隐藏而非 display:none：保留键盘聚焦能力，输入框仍可被 Tab 到 */
  .switch input {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0;
    clip: rect(0 0 0 0); clip-path: inset(50%); overflow: hidden; white-space: nowrap;
  }
  .slider {
    position: absolute; inset: 0; background: #45475a; border-radius: 12px;
    transition: .2s; cursor: pointer;
  }
  .slider::before {
    content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px;
    background: #fff; border-radius: 50%; transition: .2s;
  }
  input:checked + .slider { background: #cba6f7; }
  input:checked + .slider::before { transform: translateX(20px); }
  /* 键盘聚焦时给滑块描一圈可见的边 */
  input:focus-visible + .slider { outline: 2px solid #cba6f7; outline-offset: 2px; }
  .pick { display: flex; gap: 6px; margin: 0 0 6px; }
  .pick[hidden] { display: none; }
  .opt {
    flex: 1; padding: 6px 4px; border-radius: 8px; border: 1px solid #313244;
    background: #1e1e2e; color: #cdd6f4; font: inherit; font-size: 12px; cursor: pointer;
  }
  .opt:hover { border-color: #585b70; }
  .opt:focus-visible { outline: 2px solid #cba6f7; outline-offset: 1px; }
  .opt.on { background: #cba6f7; border-color: #cba6f7; color: #11111b; font-weight: 600; }
  .bg-pick {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-top: 8px; padding: 8px 12px; border: 1px dashed #313244; border-radius: 8px;
    background: rgba(137, 180, 250, .06); color: #89b4fa; font-size: 12.5px;
    text-decoration: none;
  }
  .bg-pick:hover { border-color: #585b70; background: rgba(137, 180, 250, .12); }
  .bg-pick:focus-visible { outline: 2px solid #cba6f7; outline-offset: 3px; }
  [hidden] { display: none !important; }
  .section {
    margin: 14px 0 2px;
    padding-top: 10px;
    border-top: 1px solid #313244;
    color: #7f849c;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .4px;
  }
  .advanced {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-top: 12px; padding: 9px 12px; border: 1px solid #313244; border-radius: 8px;
    background: #1e1e2e; color: #cdd6f4; font-size: 13px; text-decoration: none;
    transition: border-color .15s, background .15s;
  }
  .advanced:hover { border-color: #585b70; background: #242438; }
  .advanced:focus-visible { outline: 2px solid #cba6f7; outline-offset: 3px; }
  .advanced .arrow { color: #89b4fa; font-size: 12px; }
</style>
</head>
<body>
  <div class="box">
    <h1>Fuck 头歌</h1>
    <div class="row">
      <div><label class="lab" for="tt">主题</label><div class="sub" id="themeSub">深浅自动</div></div>
      <label class="switch"><input type="checkbox" id="tt"><span class="slider"></span></label>
    </div>
    <div class="pick" id="themePick" hidden>
      <button class="opt" type="button" aria-pressed="false" data-name="catppuccin">Catppuccin</button>
      <button class="opt" type="button" aria-pressed="false" data-name="github">GitHub 高对比</button>
    </div>
    <div class="row">
      <div><label class="lab" for="tf">字体</label><div class="sub">Maple Mono · 仅英文（中文需自装）</div></div>
      <label class="switch"><input type="checkbox" id="tf"><span class="slider"></span></label>
    </div>

    <div class="section">编辑器</div>
    <div class="row">
      <div><label class="lab" for="tc">光标动画</label><div class="sub">平滑移动 · 打字时也会滑动</div></div>
      <label class="switch"><input type="checkbox" id="tc"><span class="slider"></span></label>
    </div>
    <div class="row">
      <div><label class="lab" for="ts">平滑滚动</label><div class="sub">滚轮滚动更柔和</div></div>
      <label class="switch"><input type="checkbox" id="ts"><span class="slider"></span></label>
    </div>
    <div class="row">
      <div><label class="lab" for="tw">Ctrl + 滚轮缩放</label><div class="sub">按住 Ctrl 滚动缩放字号</div></div>
      <label class="switch"><input type="checkbox" id="tw"><span class="slider"></span></label>
    </div>

    <div class="section">页面</div>
    <div class="row">
      <div><label class="lab" for="tb">自定义背景</label><div class="sub">图片 · 透明度 · 编辑器区域</div></div>
      <label class="switch"><input type="checkbox" id="tb"><span class="slider"></span></label>
    </div>
    <a class="bg-pick" id="bgPick" href="options.html#background" target="_blank" rel="noreferrer" hidden>选择背景图 →</a>
    <div class="desc" id="msg" aria-live="polite">读取中… ⏳</div>
    <a class="advanced" href="options.html" target="_blank" rel="noreferrer">
      <span>高级设置</span><span class="arrow">背景 · 颜色 · 编辑器 →</span>
    </a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
