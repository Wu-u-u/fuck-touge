<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #11111b;
    --panel: #181825;
    --panel2: #1e1e2e;
    --border: #313244;
    --text: #cdd6f4;
    --dim: #a6adc8;
    --accent: #cba6f7;
    --accent-fg: #11111b;
    --green: #a6e3a1;
    --yellow: #f9e2af;
    --red: #f38ba8;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: color-mix(in srgb, var(--dim) 30%, transparent);
    border-radius: 999px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: color-mix(in srgb, var(--dim) 52%, transparent);
  }
  ::-webkit-scrollbar-corner { background: transparent; }
  body {
    margin: 0;
    width: 340px;
    padding: 9px;
    font: 13px/1.6 system-ui, "Noto Sans CJK SC", sans-serif;
    color: var(--text);
    background:
      radial-gradient(420px 260px at 12% -10%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%),
      radial-gradient(380px 260px at 100% 0%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 65%),
      var(--bg);
  }
  .box {
    padding: 16px 18px 14px;
    border: 1px solid color-mix(in srgb, var(--border) 78%, transparent);
    border-radius: 18px;
    background: linear-gradient(
      180deg,
      color-mix(in srgb, var(--panel) 84%, transparent),
      color-mix(in srgb, var(--panel2) 68%, transparent)
    );
    box-shadow:
      0 18px 48px rgba(0, 0, 0, .34),
      inset 0 1px 0 rgba(255, 255, 255, .05);
    backdrop-filter: blur(18px) saturate(1.25);
  }
  h1 { margin: 0 0 12px; font-size: 15px; font-weight: 700; letter-spacing: .2px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 8px 0; }
  .lab { font-weight: 500; cursor: pointer; }
  .sub { margin-top: 1px; color: var(--dim); font-size: 11px; }
  .desc { margin-top: 8px; color: var(--dim); font-size: 12px; }
  .desc.warn { color: var(--yellow); }
  .switch { position: relative; width: 44px; height: 24px; flex: none; }
  .switch input {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0;
    clip: rect(0 0 0 0); clip-path: inset(50%); overflow: hidden; white-space: nowrap;
  }
  .slider {
    position: absolute; inset: 0; border-radius: 12px;
    background: color-mix(in srgb, var(--border) 70%, transparent);
    transition: background .2s;
    cursor: pointer;
  }
  .slider::before {
    content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px;
    border-radius: 50%; background: #fff; transition: transform .2s, background .2s;
  }
  input:checked + .slider { background: var(--accent); }
  input:checked + .slider::before { background: var(--accent-fg); transform: translateX(20px); }
  input:focus-visible + .slider { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pick { display: flex; gap: 6px; margin: 0 0 6px; }
  .pick[hidden] { display: none; }
  .opt {
    flex: 1; padding: 7px 4px; border-radius: 9px;
    border: 1px solid var(--border);
    background: color-mix(in srgb, var(--panel2) 82%, transparent);
    color: var(--text); font: inherit; font-size: 12px; cursor: pointer;
  }
  .opt:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--border)); }
  .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .opt.on { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
  .bg-pick {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-top: 8px; padding: 8px 12px; border: 1px dashed color-mix(in srgb, var(--accent) 40%, var(--border));
    border-radius: 9px;
    background: color-mix(in srgb, var(--accent) 7%, transparent);
    color: var(--accent); font-size: 12.5px; text-decoration: none;
  }
  .bg-pick:hover { background: color-mix(in srgb, var(--accent) 13%, transparent); }
  .bg-pick:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .script-card {
    margin-top: 8px; padding: 9px 11px;
    border: 1px solid var(--border); border-radius: 10px;
    background: color-mix(in srgb, var(--panel2) 80%, transparent);
  }
  .script-card[data-state="green"] {
    border-color: color-mix(in srgb, var(--green) 38%, transparent);
    background: color-mix(in srgb, var(--green) 7%, transparent);
  }
  .script-card[data-state="yellow"] {
    border-color: color-mix(in srgb, var(--yellow) 38%, transparent);
    background: color-mix(in srgb, var(--yellow) 7%, transparent);
  }
  .script-card[data-state="red"] {
    border-color: color-mix(in srgb, var(--red) 38%, transparent);
    background: color-mix(in srgb, var(--red) 7%, transparent);
  }
  .script-top { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .script-dot {
    width: 8px; height: 8px; flex: none; border-radius: 50%;
    background: var(--red); box-shadow: 0 0 8px color-mix(in srgb, var(--red) 60%, transparent);
  }
  .script-card[data-state="green"] .script-dot {
    background: var(--green); box-shadow: 0 0 8px color-mix(in srgb, var(--green) 60%, transparent);
  }
  .script-card[data-state="yellow"] .script-dot {
    background: var(--yellow); box-shadow: 0 0 8px color-mix(in srgb, var(--yellow) 55%, transparent);
  }
  .script-title { min-width: 0; font-size: 13px; font-weight: 650; }
  .script-slot { margin-left: auto; flex: none; color: var(--dim); font-size: 10.5px; }
  .script-meta {
    margin-top: 3px; overflow: hidden; color: var(--dim); font-size: 10.5px;
    white-space: nowrap; text-overflow: ellipsis;
  }
  .script-msg { margin-top: 2px; color: var(--text); font-size: 11px; overflow-wrap: anywhere; }
  .script-msg:empty { display: none; }
  .log-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 10px; color: var(--dim); font-size: 11px;
  }
  .log-actions { display: flex; gap: 4px; }
  .log-actions button {
    padding: 3px 7px; border: 1px solid var(--border); border-radius: 6px;
    background: color-mix(in srgb, var(--panel2) 82%, transparent);
    color: var(--dim); font: inherit; font-size: 10.5px; cursor: pointer;
  }
  .log-actions button:hover:not(:disabled) { border-color: color-mix(in srgb, var(--accent) 50%, var(--border)); color: var(--text); }
  .log-actions button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .log-actions button:disabled { opacity: .4; cursor: default; }
  .log-list {
    max-height: 132px; margin-top: 6px; padding: 5px 8px;
    overflow-y: auto; scrollbar-gutter: stable;
    border: 1px solid var(--border); border-radius: 9px;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    font-size: 10.5px; line-height: 1.55;
  }
  .log-item {
    display: flex; gap: 5px; padding: 2px 0;
    border-bottom: 1px solid color-mix(in srgb, var(--border) 45%, transparent);
  }
  .log-item:last-child { border-bottom: 0; }
  .log-time { flex: none; color: var(--dim); font-variant-numeric: tabular-nums; }
  .log-level {
    flex: none; height: 16px; padding: 0 4px; border-radius: 4px;
    background: color-mix(in srgb, var(--border) 55%, transparent);
    color: var(--dim); font-size: 9.5px; line-height: 16px;
  }
  .log-level.warn { background: color-mix(in srgb, var(--yellow) 14%, transparent); color: var(--yellow); }
  .log-level.error { background: color-mix(in srgb, var(--red) 14%, transparent); color: var(--red); }
  .log-text { min-width: 0; color: var(--text); overflow-wrap: anywhere; }
  .log-empty { padding: 8px 0; color: var(--dim); text-align: center; }
  [hidden] { display: none !important; }
  .section {
    margin: 14px 0 2px; padding-top: 10px;
    border-top: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
    color: var(--dim); font-size: 11px; font-weight: 600; letter-spacing: .4px;
  }
  .advanced {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-top: 12px; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 10px;
    background: color-mix(in srgb, var(--panel2) 76%, transparent);
    color: var(--text); font-size: 13px; text-decoration: none;
    transition: border-color .15s, background .15s;
  }
  .advanced:hover { border-color: color-mix(in srgb, var(--accent) 48%, var(--border)); background: color-mix(in srgb, var(--panel2) 92%, transparent); }
  .advanced:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .advanced .arrow { color: var(--accent); font-size: 12px; }
</style>
</head>
<body>
  <div class="box">
    <h1>Fuck 头歌</h1>
    <div class="row">
      <div><label class="lab" for="tt">主题</label><div class="sub" id="themeSub">深浅自动</div></div>
      <label class="switch"><input type="checkbox" id="tt"><span class="slider"></span></label>
    </div>
    <div class="pick" id="themePick" hidden>
      <button class="opt" type="button" aria-pressed="false" data-name="catppuccin">Catppuccin</button>
      <button class="opt" type="button" aria-pressed="false" data-name="github">GitHub 高对比</button>
    </div>
    <div class="row">
      <div><label class="lab" for="tf">字体</label><div class="sub">Maple Mono · 仅英文（中文需自装）</div></div>
      <label class="switch"><input type="checkbox" id="tf"><span class="slider"></span></label>
    </div>

    <div class="section">编辑器</div>
    <div class="row">
      <div><label class="lab" for="tc">光标动画</label><div class="sub">平滑移动 · 打字时也会滑动</div></div>
      <label class="switch"><input type="checkbox" id="tc"><span class="slider"></span></label>
    </div>
    <div class="row">
      <div><label class="lab" for="ts">平滑滚动</label><div class="sub">滚轮滚动更柔和</div></div>
      <label class="switch"><input type="checkbox" id="ts"><span class="slider"></span></label>
    </div>
    <div class="row">
      <div><label class="lab" for="tw">Ctrl + 滚轮缩放</label><div class="sub">按住 Ctrl 滚动缩放字号</div></div>
      <label class="switch"><input type="checkbox" id="tw"><span class="slider"></span></label>
    </div>

    <div class="section">页面</div>
    <div class="row">
      <div><label class="lab" for="tb">自定义背景</label><div class="sub">图片 · 透明度 · 编辑器区域</div></div>
      <label class="switch"><input type="checkbox" id="tb"><span class="slider"></span></label>
    </div>
    <a class="bg-pick" id="bgPick" href="options.html#background" target="_blank" rel="noreferrer" hidden>选择背景图 →</a>
    <div class="desc" id="msg" aria-live="polite">读取中… ⏳</div>

    <div class="section">脚本状态</div>
    <div class="script-card" id="scriptCard" data-state="red" aria-live="polite">
      <div class="script-top">
        <span class="script-dot"></span>
        <span class="script-title" id="scriptTitle">刷题脚本未执行</span>
        <span class="script-slot" id="scriptSlot">槽位 --</span>
      </div>
      <div class="script-meta" id="scriptMeta">等待脚本状态…</div>
      <div class="script-msg" id="scriptMsg"></div>
    </div>

    <div class="log-head">
      <span>日志 <span id="logCount">0</span>/25</span>
      <div class="log-actions">
        <button type="button" id="copyLogs" disabled>复制</button>
        <button type="button" id="clearLogs" disabled>清空</button>
      </div>
    </div>
    <div class="log-list" id="logList">
      <div class="log-empty">暂无日志</div>
    </div>

    <a class="advanced" href="options.html" target="_blank" rel="noreferrer">
      <span>高级设置</span><span class="arrow">背景 · 颜色 · 编辑器 →</span>
    </a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
