package step4;

public class Reverse {
    public static StringBuffer start(String data) {
        StringBuffer ans = new StringBuffer();
        /********** Begin *********/
        String[] words = data.split(" ");
        for (int i = 0; i < words.length; i++) {
            ans.append(new StringBuffer(words[i]).reverse());
            if (i < words.length - 1) {
                ans.append(" ");
            }
        }
        /********** End *********/
        return ans;
    }
}
