        return (a + b + c) / 3;
    }

    public static void printRect(int a, int b) {
        for (int i = 0; i < a; i++) {
            for (int j = 0; j < b; j++) {
                System.out.print("*");
            }
            System.out.println();
        }
    }

    public static void sortArr(int[] arr) {
        Arrays.sort(arr);
        for (int x : arr) {
            System.out.println(x);
        }
    }

    public static void Print99() {
        for (int i = 1; i <= 9; i++) {
            for (int j = 1; j <= i; j++) {
                System.out.print(j + " * " + i + " = " + i * j + "\t");
            }
            System.out.println();
        }
    }

    /********** End **********/
}	
