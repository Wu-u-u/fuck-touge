package case1;

import java.util.Scanner;

public class Task1 {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);
        String dogName = sc.next();
        String dogSex = sc.next();
        String dogColor = sc.next();
        String catName = sc.next();
        String catSex = sc.next();
        double catWeight = sc.nextDouble();
        // 通过有参构造函数实例化Dog类对象dog
        // dog调用talk()方法
        // dog调用eat()方法
        /********* begin *********/
        Dog dog = new Dog(dogName, dogSex, dogColor);
        dog.talk();
        dog.eat();
        /********* end *********/
        // 通过有参构造函数实例化Cat类对象cat
        // cat调用talk()方法
        // cat调用eat()方法
        /********* begin *********/
        Cat cat = new Cat(catName, catSex, catWeight);
        cat.talk();
        cat.eat();
        /********* end *********/
    }
}

// 声明抽象类Pet
/********* begin *********/
abstract class Pet {
    protected String name;
    protected String sex;

    public Pet(String name, String sex) {
        this.name = name;
        this.sex = sex;
    }

    public abstract void talk();

    public abstract void eat();
}
/********* end *********/

// 声明Dog类继承自Pet
/********* begin *********/
class Dog extends Pet {
    private String color;

    public Dog(String name, String sex, String color) {
        super(name, sex);
        this.color = color;
    }

    @Override
    public void talk() {
        System.out.println("名称：" + name + "，性别：" + sex + "，颜色：" + color + "，汪汪叫");
    }

    @Override
    public void eat() {
        System.out.println(name + "吃骨头！");
    }
}
/********* end *********/

// 声明Cat类继承自Pet
/********* begin *********/
class Cat extends Pet {
    private double weight;

    public Cat(String name, String sex, double weight) {
        super(name, sex);
        this.weight = weight;
    }

    @Override
    public void talk() {
        System.out.println("名称：" + name + "，性别：" + sex + "，体重：" + weight + "kg，喵喵叫");
    }

    @Override
    public void eat() {
        System.out.println(name + "吃鱼！");
    }
}
/********* end *********/
'''

